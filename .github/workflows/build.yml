name: Otomatik APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK Kur
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Gradle 8.7 ile APK Derle
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/g.zip
          unzip -qo /tmp/g.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: hazir-apk
          path: app/build/outputs/apk/debug/app-debug.apk
